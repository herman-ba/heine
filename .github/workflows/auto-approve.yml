name: merge-instantly

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-now:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # 1 – Checkout the PR’s base branch
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          token: ${{ secrets.AUTO_MERGE_PAT }}

      # 2 – Give Git an author identity for the commit(s)
      - name: Configure Git author
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 3 – Fetch the PR branch as "pr"
      - name: Fetch PR branch
        run: |
          git fetch --no-tags origin pull/${{ github.event.pull_request.number }}/head:pr

      # 4 – Attempt a merge without committing
      - name: Try fast merge
        id: merge
        run: |
          set -eo pipefail
          if git merge --no-commit --no-ff pr; then
            echo "MERGE_SUCCESS=true"  >> "$GITHUB_OUTPUT"
          else
            echo "MERGE_SUCCESS=false" >> "$GITHUB_OUTPUT"
          fi

      # 5 – Resolve conflicts by deleting the base-branch copies
      - name: Resolve conflicts (prefer PR versions)
        if: steps.merge.outputs.MERGE_SUCCESS == 'false'
        run: |
          echo "🔧 Conflicts detected – preferring PR versions…"
          git diff --name-only --diff-filter=U > conflicts.txt
          while IFS= read -r file; do
            git rm --cached --quiet "$file"   # drop base copy
            git checkout pr -- "$file"        # restore PR copy
          done < conflicts.txt
          rm conflicts.txt
          git add .
          git commit -m "chore: auto-resolve merge conflicts by deleting base versions"

      # 6 – If the merge was clean, we still need to commit it
      - name: Commit clean merge
        if: steps.merge.outputs.MERGE_SUCCESS == 'true'
        run: |
          git commit -m "chore: auto-merge PR #${{ github.event.pull_request.number }}"

      # 7 – Push to the base branch (closes the PR as merged)
      - name: Push merged changes
        run: |
          git push origin HEAD:${{ github.event.pull_request.base.ref }}

      # 8 – Safety-net: ensure PR is closed
      - name: Ensure PR is closed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AUTO_MERGE_PAT }}
          script: |
            const {owner, repo} = context.repo;
            const number = context.payload.pull_request.number;
            const pr = await github.rest.pulls.get({owner, repo, pull_number: number});
            if (pr.data.state !== "closed") {
              await github.rest.pulls.update({owner, repo, pull_number: number, state: "closed"});
            }
