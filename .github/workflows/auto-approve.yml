name: auto-merge-prefer-pr

on:
  pull_request_target:
    # Run on every update except while the PR is a draft
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write          # push to base branch
  pull-requests: write     # (not strictly needed now, but handy)

jobs:
  merge-prefer-pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false   # skip drafts
    env:
      BASE_REF:   ${{ github.event.pull_request.base.ref }}
      PR_NUM:     ${{ github.event.pull_request.number }}
      PR_REF:     pull/${{ github.event.pull_request.number }}/head
      GIT_TOKEN:  ${{ secrets.AUTO_MERGE_PAT }}

    steps:
    # -----------------------------------------------------------------
    # 1.  Prepare repository & Git identity
    # -----------------------------------------------------------------
    - name: Checkout base branch
      uses: actions/checkout@v4
      with:
        ref:          ${{ env.BASE_REF }}
        token:        ${{ env.GIT_TOKEN }}
        fetch-depth:  0            # full history (needed for merge)

    - name: Configure Git author
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Fetch PR branch locally
      run: |
        git fetch --no-tags origin ${{ env.PR_REF }}:pr

    # -----------------------------------------------------------------
    # 2.  Fast-exit if the PR head is *already* in the base branch
    # -----------------------------------------------------------------
    - name: Check if merge already contained
      id: already
      run: |
        if git merge-base --is-ancestor pr HEAD; then
          echo "merged=true" >>"$GITHUB_OUTPUT"
        else
          echo "merged=false" >>"$GITHUB_OUTPUT"
        fi

    - name: Short-circuit (nothing to do)
      if: steps.already.outputs.merged == 'true'
      run: echo "✅ Base branch already contains PR head – nothing to do."

    # -----------------------------------------------------------------
    # 3.  Try a non-committing merge
    # -----------------------------------------------------------------
    - name: Attempt merge (no commit yet)
      if: steps.already.outputs.merged != 'true'
      id: trymerge
      run: |
        set +e                                  # we want exit-code
        git merge --no-commit --no-ff pr
        echo "result=$?" >>"$GITHUB_OUTPUT"
        set -e

    # -----------------------------------------------------------------
    # 4.  Conflict-resolver – keep the PR’s versions
    # -----------------------------------------------------------------
    - name: Resolve conflicts by keeping PR files
      if: |
        steps.already.outputs.merged != 'true' &&
        steps.trymerge.outputs.result != '0'
      run: |
        echo "🔧 Conflicts detected – preferring PR versions…"
        git diff --name-only --diff-filter=U > conflicts.txt

        if [ ! -s conflicts.txt ]; then
          echo "ℹ️  No unmerged paths found – nothing to resolve."
        else
          while IFS= read -r file; do
            git rm  --cached --quiet "$file"   # drop base copy
            git checkout pr -- "$file"         # restore PR copy
          done < conflicts.txt
        fi

    # -----------------------------------------------------------------
    # 5.  Finalise *one* merge commit – always
    # -----------------------------------------------------------------
    - name: Finalise merge commit
      if: steps.already.outputs.merged != 'true'
      run: |
        # Stage everything (if anything changed)
        git add -A

        # Always create the merge commit.  --allow-empty lets us create it
        # even if the tree is identical to HEAD (rare but safe).
        git commit --allow-empty \
          -m "chore: auto-merge PR #${{ env.PR_NUM }}  
              
              * Strategy: keep PR versions on conflict  
              * Workflow: auto-merge-prefer-pr"

    # -----------------------------------------------------------------
    # 6.  Push – GitHub will automatically mark the PR as *Merged*
    # -----------------------------------------------------------------
    - name: Push to base branch
      if: steps.already.outputs.merged != 'true'
      run: |
        git push origin HEAD:${{ env.BASE_REF }}
